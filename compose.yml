# zeek_ad_dashboard Docker Compose (VMware Ubuntu Server 단일 VM 내 zeek_AD 통합 운영 기준)
# - 동일 Compose 병합: docker compose -f ../zeek_AD/compose.yml -f compose.yml up -d --build
# - 외부 네트워크 연동 시 아래 networks.dashboard-net에 external: true 및 zeek_AD 네트워크 이름을 지정하세요.
# - 전달 헤더 신뢰(T32): 앱은 nginx-waf 고정 주소(DASHBOARD_WAF_IP)에서 온 연결의 X-Forwarded-*만 믿는다.
#   외부 네트워크로 바꾸면 그 네트워크 서브넷 안의 빈 주소를 DASHBOARD_WAF_IP로 준다(docs/deployment-guide.md 1.2).

# T58 컨테이너 로그 한도(이 파일의 두 서비스가 쓴다): json-file, 파일 하나 10MB, 5개까지(컨테이너마다 50MB까지). 넘으면 오래된 파일부터 지운다.
# 기간이 아니라 크기 한도다. nginx-waf 접근 로그와 ModSecurity 기록에는 접속 주소가 들어 있다. 서비스를 다시 만들어야 걸린다.
x-zeekad-logging: &zeekad-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  dashboard-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: zeek-ad-dashboard-app:local
    expose:
      - "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_PORT: "8080"
      DASHBOARD_DB_HOST: ${DASHBOARD_DB_HOST:-postgres}
      DASHBOARD_DB_PORT: ${DASHBOARD_DB_PORT:-5432}
      DASHBOARD_DB_NAME: ${DASHBOARD_DB_NAME:-zeekad_dashboard}
      DASHBOARD_DB_USER: ${DASHBOARD_DB_USER:-dashboard_app}
      DASHBOARD_APP_PASSWORD: ${DASHBOARD_APP_PASSWORD:-}
      ZEEKAD_DB_HOST: ${ZEEKAD_DB_HOST:-postgres}
      ZEEKAD_DB_PORT: ${ZEEKAD_DB_PORT:-5432}
      ZEEKAD_DB_NAME: ${ZEEKAD_DB_NAME:-zeekad}
      ZEEKAD_RO_USER: ${ZEEKAD_RO_USER:-dashboard_ro}
      ZEEKAD_RO_PASSWORD: ${ZEEKAD_RO_PASSWORD:-}
      ZEEKAD_RW_USER: ${ZEEKAD_RW_USER:-dashboard_rw}
      ZEEKAD_RW_PASSWORD: ${ZEEKAD_RW_PASSWORD:-}
      ZEEKAD_EVIDENCE_API_URL: ${ZEEKAD_EVIDENCE_API_URL:-http://api:8000}
      DASHBOARD_COOKIE_SECURE: ${DASHBOARD_COOKIE_SECURE:-true}
      # T32: X-Forwarded-*를 믿을 연결은 nginx-waf 고정 주소 하나뿐이다(아래 nginx-waf ipv4_address와 같은 변수·기본값).
      # 같은 네트워크의 다른 컨테이너가 앱 8080에 직접 붙어 전달 헤더를 보내도 감사 로그 IP는 그 컨테이너 주소다.
      DASHBOARD_TRUSTED_PROXIES: ${DASHBOARD_WAF_IP:-10.203.49.250}
      DASHBOARD_SESSION_IDLE_TIMEOUT: ${DASHBOARD_SESSION_IDLE_TIMEOUT:-30m}
      DASHBOARD_MAX_FAILED_ATTEMPTS: ${DASHBOARD_MAX_FAILED_ATTEMPTS:-5}
      DASHBOARD_LOCKOUT_MINUTES: ${DASHBOARD_LOCKOUT_MINUTES:-15}
      # T29: 잠금 제외 공유 조회 계정(쉼표 목록). 이 스택은 비워 둔다(모든 계정이 잠긴다).
      DASHBOARD_LOCKOUT_EXEMPT_USERNAMES: ${DASHBOARD_LOCKOUT_EXEMPT_USERNAMES:-}
      DASHBOARD_IDLE_TIMEOUT_MINUTES: ${DASHBOARD_IDLE_TIMEOUT_MINUTES:-30}
      DASHBOARD_ABSOLUTE_TIMEOUT_MINUTES: ${DASHBOARD_ABSOLUTE_TIMEOUT_MINUTES:-480}
      # T23: 기준 시각(now = 서버 현재 시각, 운영 기본). 실습망 센서로 볼 캡처 패턴(나머지는 가져온 데이터)
      DASHBOARD_TIME_ANCHOR: ${DASHBOARD_TIME_ANCHOR:-now}
      DASHBOARD_LIVE_CAPTURE_PATTERNS: ${DASHBOARD_LIVE_CAPTURE_PATTERNS:-lab-*}
      DASHBOARD_BOOTSTRAP_PASSWORD: ${DASHBOARD_BOOTSTRAP_PASSWORD:-}
      BOOTSTRAP_VIEWER1_PASSWORD: ${BOOTSTRAP_VIEWER1_PASSWORD:-}
      BOOTSTRAP_ANALYST1_PASSWORD: ${BOOTSTRAP_ANALYST1_PASSWORD:-}
      BOOTSTRAP_ANALYST2_PASSWORD: ${BOOTSTRAP_ANALYST2_PASSWORD:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_TOTP_SECRET: ${BOOTSTRAP_ADMIN_TOTP_SECRET:-}
    # T61: 공개 스택(compose.portfolio.yml)과 같다. 이미지가 일반 계정으로 8080을 열므로 capability가 필요 없다.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/login"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *zeekad-logging
    restart: unless-stopped
    networks:
      - dashboard-net

  nginx-waf:
    build:
      context: ./docker/nginx-waf
      dockerfile: Dockerfile
    image: zeek-ad-dashboard-waf:local
    depends_on:
      dashboard-app:
        condition: service_healthy
    ports:
      - "${WAF_HTTP_PORT:-80}:8080"
      - "${WAF_HTTPS_PORT:-443}:8443"
    volumes:
      - ./docker/certs:/etc/nginx/ssl:ro
    environment:
      BACKEND: "http://dashboard-app:8080"
      PORT: "8080"
      SSL_PORT: "8443"
      SSL_REDIRECT_PORT: ${SSL_REDIRECT_PORT:-${WAF_HTTPS_PORT:-443}}
      SERVER_NAME: ${SERVER_NAME:-${WAF_SERVER_NAME:-localhost}}
      SSL_CERT_FILE: ${SSL_CERT_FILE:-/etc/nginx/conf/server.crt}
      SSL_CERT_KEY_FILE: ${SSL_CERT_KEY_FILE:-/etc/nginx/conf/server.key}
      NGINX_ALWAYS_TLS_REDIRECT: "on"
      SSL_OCSP_STAPLING: "off"
      SERVER_TOKENS: "off"
      SERVER_HEADER: ""
      PROXY_HOST_HEADER: ${PROXY_HOST_HEADER:-$$http_host}
      NGINX_X_FORWARDED_PROTO: "$$scheme"
      NGINX_X_FORWARDED_PORT: "$$server_port"
      # 클라이언트 IP: 이 스택은 WAF가 맨 앞이다(클라이언트가 직접 붙는다). 앞단 프록시를 신뢰하지 않으므로 127.0.0.1만 믿고
      # 그 밖의 연결은 접속 주소가 곧 클라이언트 IP다. 사설망 대역을 통째로 넣으면 같은 사설망(VMware NAT, Docker 게이트웨이 등)의
      # 누구나 X-Forwarded-For로 감사 로그 IP를 바꿀 수 있다. 앞단 프록시 뒤에 둘 때는 docs/deployment-guide.md 1.2를 따른다.
      SET_REAL_IP_FROM: "127.0.0.1"
      REAL_IP_HEADER: "X-Forwarded-For"
      REAL_IP_RECURSIVE: "on"
      MODSEC_RULE_ENGINE: "on"
      # CRS 기본 허용 메서드(GET HEAD POST OPTIONS)에 PUT만 더한다: SPA의 PUT /api/admin/users/{id} 때문.
      # 앱이 쓰지 않는 DELETE·PATCH는 넣지 않는다.
      ALLOWED_METHODS: "GET HEAD POST PUT OPTIONS"
      PARANOIA: "1"
      BLOCKING_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      MODSEC_AUDIT_ENGINE: "RelevantOnly"
      # 감사 로그에 남기는 부분(요청·응답의 헤더와 본문은 뺀다)은 WAF 이미지(docker/nginx-waf/Dockerfile)가 정한다. 여기서 덮지 않는다.
      MODSEC_AUDIT_LOG: "/dev/stdout"
    # T61: 모든 capability 제거·권한 상승 금지(이미지가 nginx 계정으로 8080·8443을 연다. 호스트의 80·443은 Docker가 잇는다).
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # T61: Host를 이름으로 보낸다. 숫자 주소 Host는 CRS 920350에 걸려 응답이 200이어도 상태 확인마다 감사 줄이 남았다(10초마다 한 줄).
      # 접속 주소는 127.0.0.1 그대로다. WAF 규칙은 끄지 않는다(바깥에서 숫자 주소 Host로 온 요청은 지금처럼 감사 줄이 남는다).
      test: ["CMD", "wget", "-q", "--spider", "--header", "Host: localhost", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging: *zeekad-logging
    restart: unless-stopped
    networks:
      dashboard-net:
        # T32: 고정 주소(동적 배정 범위 DASHBOARD_IP_RANGE 밖). 앱 DASHBOARD_TRUSTED_PROXIES와 같은 변수다.
        ipv4_address: ${DASHBOARD_WAF_IP:-10.203.49.250}

networks:
  dashboard-net:
    driver: bridge
    ipam:
      config:
        # T32: 고정 서브넷과 동적 배정 범위(앞 절반). nginx-waf 고정 주소는 이 범위 밖(.250)이라 다른 컨테이너와 겹치지 않는다.
        # 포트폴리오 스택(10.203.48.0/24)과 겹치지 않는다. 바꾸면 DASHBOARD_WAF_IP도 서브넷 안·범위 밖으로 바꾼다.
        # 이미 떠 있는 스택은 네트워크를 한 번 다시 만들어야 한다(down 뒤 up, 볼륨 유지).
        - subnet: ${DASHBOARD_SUBNET:-10.203.49.0/24}
          ip_range: ${DASHBOARD_IP_RANGE:-10.203.49.0/25}
  # 별도 Compose 스택의 zeek_AD 네트워크와 연결할 경우 아래처럼 외부 네트워크로 전환하세요(위 ipam은 지운다).
  # 그 네트워크 서브넷 안의 빈 주소를 DASHBOARD_WAF_IP로 준다. 서브넷을 정할 수 없으면 nginx-waf의 ipv4_address를 지우고
  # DASHBOARD_TRUSTED_PROXIES를 빈 값으로 둔다(감사 로그 IP가 WAF 주소가 되지만 다른 컨테이너가 꾸밀 수는 없다).
  # dashboard-net:
  #   external: true
  #   name: ${ZEEKAD_DOCKER_NETWORK:-zeek_ad_default}
