# zeek_ad_dashboard 포트폴리오 공개 배포 스택(Synology NAS 단독, compose.yml과 독립된 파일. 병합하지 않는다).
# - 구성: PostgreSQL 17(zeek_AD 스냅샷 복원) / zeek_AD 근거 API / dashboard-app / nginx-waf.
# - 공개 경로: DSM 역방향 프록시(HTTPS, TLS 종료) -> 127.0.0.1:${PORTFOLIO_HTTP_PORT} (nginx-waf HTTP) -> dashboard-app.
#   바깥에 여는 포트는 nginx-waf HTTP 하나뿐이고 127.0.0.1에만 묶는다(DSM만 접근 = 전달 헤더를 믿는 근거).
# - 전달 헤더 신뢰(T32): nginx-waf는 127.0.0.1과 Docker 게이트웨이(DSM 경로)에서 온 것만, 앱은 nginx-waf 고정 주소에서 온 것만 믿는다.
# - 네트워크 둘(T61): portfolio-net에는 nginx-waf와 dashboard-app만, portfolio-data(내부 전용, 바깥 길 없음)에는 dashboard-app·postgres·api와
#   초기화·시드 도구가 붙는다. 인터넷 요청을 받는 nginx-waf는 DB와 근거 API에 직접 닿지 못한다. 모든 컨테이너는 capability 없이 돈다.
# - 실행: docker compose -p zeekad-portfolio -f compose.portfolio.yml --env-file .env up -d
#   계정 시드: docker compose -p zeekad-portfolio -f compose.portfolio.yml --env-file .env --profile seed run --rm demo-seed
#   체험 계정 초기화 설정(T33, 시드 뒤 한 번): ... --profile seed run --rm sandbox-setup
#   자세한 절차는 docs/portfolio-deployment.md.
# - NAS의 Compose(옛 판)에서 docker compose config가 통과하는 문법만 쓴다. 비밀값은 ${X:?}(필수 보간)로 막지 않는다
#   (빈 비밀번호는 PostgreSQL 이미지·초기화 스크립트·시드 스크립트가 거부한다).
name: zeekad-portfolio

# T58 컨테이너 로그 한도(모든 서비스가 쓴다): json-file, 파일 하나 10MB, 5개까지(컨테이너마다 50MB까지). 넘으면 오래된 파일부터 지운다.
# 기간이 아니라 크기 한도다(Docker는 기간으로 지우지 않는다). nginx-waf 접근 로그와 ModSecurity 기록(접속 주소가 들어 있다)이 여기에 해당한다.
# 이미 떠 있는 컨테이너에는 걸리지 않는다. 서비스를 다시 만들어야 걸린다(docs/portfolio-deployment.md).
x-zeekad-logging: &zeekad-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: ${PORTFOLIO_POSTGRES_IMAGE:-pgvector/pgvector:0.8.1-pg17}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      # 비어 있으면 PostgreSQL 이미지가 초기화를 거부한다.
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-}
      # 01-roles-databases.sh가 읽는 로그인 역할 비밀번호(하나라도 비어 있으면 초기화를 멈춘다).
      ZEEKAD_API_PASSWORD: ${ZEEKAD_API_PASSWORD:-}
      DASHBOARD_RO_PASSWORD: ${DASHBOARD_RO_PASSWORD:-}
      DASHBOARD_RW_PASSWORD: ${DASHBOARD_RW_PASSWORD:-}
      DASHBOARD_APP_PASSWORD: ${DASHBOARD_APP_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/portfolio/initdb:/docker-entrypoint-initdb.d:ro
      - ${PORTFOLIO_SNAPSHOT_DIR:-./snapshot}:/snapshot:ro
    # T61: root로 시작하지 않는다(sandbox-*와 같은 꼴). 이미지의 진입 스크립트는 root가 아니면 소유자 바꾸기(chown)와 gosu를 건너뛴다.
    # 데이터 경로는 이미지가 postgres 소유로 만들어 두므로 새 볼륨도, 옛 구성(root로 시작해 gosu로 내려감)이 만든 볼륨도 uid가 같다.
    user: postgres
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # TCP로 확인(초기화 중 임시 서버는 소켓만 연다) + 스냅샷 복원 성공 표지(02-restore-snapshot.sh)가 있어야 healthy.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d zeekad && test -s \"$$PGDATA/portfolio-restore.ok\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    mem_limit: 1g
    logging: *zeekad-logging
    restart: unless-stopped
    networks:
      - portfolio-data

  api:
    image: ${PORTFOLIO_PIPELINE_IMAGE:-zeekad-pipeline:dev}
    command: ["python", "scripts/run_api.py", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      ZEEKAD_API_PASSWORD: ${ZEEKAD_API_PASSWORD:-}
    # zeek_AD deploy/compose.yaml의 api와 같다: 일반 계정(uid 1000), 모든 capability 제거, 권한 상승 금지.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1g
    logging: *zeekad-logging
    restart: unless-stopped
    networks:
      - portfolio-data

  dashboard-app:
    image: ${PORTFOLIO_APP_IMAGE:-zeek-ad-dashboard-app:local}
    environment:
      SERVER_PORT: "8080"
      DASHBOARD_DB_HOST: postgres
      DASHBOARD_DB_PORT: "5432"
      DASHBOARD_DB_NAME: zeekad_dashboard
      DASHBOARD_DB_USER: dashboard_app
      DASHBOARD_APP_PASSWORD: ${DASHBOARD_APP_PASSWORD:-}
      ZEEKAD_DB_HOST: postgres
      ZEEKAD_DB_PORT: "5432"
      ZEEKAD_DB_NAME: zeekad
      ZEEKAD_RO_USER: dashboard_ro
      ZEEKAD_RO_PASSWORD: ${DASHBOARD_RO_PASSWORD:-}
      ZEEKAD_RW_USER: dashboard_rw
      ZEEKAD_RW_PASSWORD: ${DASHBOARD_RW_PASSWORD:-}
      ZEEKAD_EVIDENCE_API_URL: http://api:8000
      DASHBOARD_COOKIE_SECURE: "true"
      # T32: X-Forwarded-*를 믿을 연결은 nginx-waf 고정 주소 하나뿐이다(아래 nginx-waf ipv4_address와 같은 변수·기본값).
      # 같은 네트워크의 다른 컨테이너(T61부터는 portfolio-data의 api·초기화·시드 도구)가 앱 8080에 직접 붙어 전달 헤더를 보내도
      # 감사 로그 IP는 그 컨테이너 주소다.
      DASHBOARD_TRUSTED_PROXIES: ${PORTFOLIO_WAF_IP:-10.203.48.250}
      # T29: 계정 잠금은 모든 계정에 5회·15분(앱 기본)이다. .env 변수를 쓰지 않는다(옛 .env의 PORTFOLIO_MAX_FAILED_ATTEMPTS는 무시된다).
      # 비밀번호를 공개한 공유 계정(demo, trial-analyst)만 아래 목록으로 잠금에서 빠지고, 무작위 대입은 nginx-waf의 IP당 로그인 속도 제한이 막는다.
      DASHBOARD_MAX_FAILED_ATTEMPTS: "5"
      # T29·T33: 비밀번호를 공개한 공유 계정만 계정 잠금에서 뺀다. 지금 역할이 VIEWER·ANALYST일 때만 빠지고 ADMIN은 목록에 있어도 잠긴다.
      # 목록에는 비밀번호를 공개한 공유 계정만 넣는다(실제 분석가처럼 비공개 비밀번호 계정을 넣으면 그 계정도 잠기지 않아
      # 여러 IP 대입을 IP당 속도 제한만 막는다).
      DASHBOARD_LOCKOUT_EXEMPT_USERNAMES: ${DASHBOARD_LOCKOUT_EXEMPT_USERNAMES:-demo,trial-analyst}
      # T23: 기준 시각. 데이터가 더 늘지 않는 고정 스냅샷이라 "최근 24시간" 등을 데이터 최신 시각(사용자 허용 캡처 기준)에서 센다.
      # 화면 맨 위에 "고정 스냅샷 · 기준 시각"을 늘 보이고 새 인시던트 자동 갱신을 끈다. 데모 모드가 아니라 과거 데이터 조사용 일반 설정이다.
      DASHBOARD_TIME_ANCHOR: ${PORTFOLIO_TIME_ANCHOR:-latest-data}
      # T21: 로그인 화면 안내 문구(일반 텍스트, 300자 이하). 비밀번호는 넣지 않는다.
      # T50: 네 줄로 나눈다(\n은 줄바꿈, 화면이 줄바꿈을 그대로 보인다. 지금 288자). 넷째 줄은 접속 기록 안내다.
      DASHBOARD_LOGIN_NOTICE: "포트폴리오 공개 데모입니다. 읽기 전용 계정 demo와 분석가 체험 계정 trial-analyst가 있습니다(비밀번호는 포트폴리오 소개 글에 있습니다).\n분석가 체험 계정으로 바꾼 내용은 매시 정각에 되돌립니다. 정각 직후에는 화면을 새로 고쳐 주세요.\n데이터는 공개 데이터셋 CIC-IDS2017과 합성 APT 패턴, 격리 실습망 트래픽입니다.\n로그인 기록과 분석가 체험 계정의 열람·변경 기록(계정, 접속 IP, 시각)은 감사 로그에 남고 관리자만 봅니다. 접속 IP와 요청 주소는 웹 방화벽 로그에도 남습니다."
      # T50: 안내 문구 아래에 붙는 링크 하나(https 주소와 라벨). 앱이 검사하고, 걸리면 링크만 내리지 않는다.
      DASHBOARD_LOGIN_NOTICE_LINK_URL: "https://github.com/prosild/zeek_ad_dashboard#readme"
      DASHBOARD_LOGIN_NOTICE_LINK_LABEL: "소개와 구조 보기(GitHub README)"
      # 부트스트랩은 users 표가 비었을 때(첫 기동) 한 번만 돈다. 계정마다 서로 다른 비공개 무작위 비밀번호.
      DASHBOARD_BOOTSTRAP_PASSWORD: ""
      BOOTSTRAP_VIEWER1_PASSWORD: ${BOOTSTRAP_VIEWER1_PASSWORD:-}
      BOOTSTRAP_ANALYST1_PASSWORD: ${BOOTSTRAP_ANALYST1_PASSWORD:-}
      BOOTSTRAP_ANALYST2_PASSWORD: ${BOOTSTRAP_ANALYST2_PASSWORD:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_TOTP_SECRET: ${BOOTSTRAP_ADMIN_TOTP_SECRET:-}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/login"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    mem_limit: 1g
    logging: *zeekad-logging
    restart: unless-stopped
    # T61: 두 네트워크에 붙는 것은 앱뿐이다. portfolio-net으로 nginx-waf의 요청을 받고 portfolio-data로 postgres와 api를 부른다.
    networks:
      - portfolio-net
      - portfolio-data

  nginx-waf:
    image: ${PORTFOLIO_WAF_IMAGE:-zeek-ad-dashboard-waf:local}
    depends_on:
      dashboard-app:
        condition: service_healthy
    ports:
      # 이것 하나만 연다. 127.0.0.1에만 묶어 DSM 역방향 프록시만 접근한다(LAN에서도 직접 접근 불가).
      - "127.0.0.1:${PORTFOLIO_HTTP_PORT:-18480}:8080"
    volumes:
      # 포트폴리오 전용 nginx http 문맥 설정(DSM 뒤의 실제 IP·전달 Proto/Port 규칙·로그인 속도 제한). 기존 compose.yml에는 붙이지 않는다.
      # 방문자가 붙인 Forwarded·X-Forwarded-Host/Prefix/Ssl 지우기는 공유 이미지 템플릿(proxy_backend.conf)이 모든 스택에서 한다.
      - ./docker/portfolio/nginx/zeekad-portfolio-http.conf.template:/etc/nginx/templates/conf.d/zeekad-portfolio-http.conf.template:ro
    environment:
      BACKEND: "http://dashboard-app:8080"
      PORT: "8080"
      # 8443은 portfolio-net 안에서만 쓴다(ZAP 리허설 대상, 이미지 기본 자체 서명 인증서). 바깥에 열지 않는다.
      SSL_PORT: "8443"
      SERVER_NAME: ${PORTFOLIO_SERVER_NAME:-localhost}
      # TLS는 DSM이 끝내므로 HTTP 리스너에서 HTTPS로 리다이렉트하지 않는다.
      NGINX_ALWAYS_TLS_REDIRECT: "off"
      SSL_OCSP_STAPLING: "off"
      SERVER_TOKENS: "off"
      SERVER_HEADER: ""
      PROXY_HOST_HEADER: "$$http_host"
      # 앱에 넘기는 전달 헤더(zeekad-portfolio-http.conf의 map): 들어온 X-Forwarded-Proto가 https면 https/443.
      NGINX_X_FORWARDED_PROTO: "$$zeekad_forwarded_proto"
      ZEEKAD_PROXY_X_FORWARDED_PORT: "$$zeekad_forwarded_port"
      # X-Forwarded-For는 덧붙이지 않고 nginx가 정한 클라이언트 IP 하나로 덮어쓴다(방문자가 붙인 값이 감사 로그에 남지 않게).
      # T14부터 이미지 기본값과 같지만 이 스택의 의도를 보이려고 남긴다.
      ZEEKAD_PROXY_X_FORWARDED_FOR: "$$remote_addr"
      # 실제 IP(T32): 신뢰 범위는 127.0.0.1과 Docker 게이트웨이 주소 하나뿐이다. DSM이 127.0.0.1:${PORTFOLIO_HTTP_PORT}로 붙은
      # 연결은 컨테이너 안에서 게이트웨이 주소에서 온 것으로 보인다. 같은 네트워크의 다른 컨테이너(서브넷 주소. T61부터는 앱뿐이다)는 믿지 않는다.
      # 템플릿(zeekad-portfolio-http.conf)의 set_real_ip_from과 X-Forwarded-Proto/Port 출처 판정도 같은 변수를 쓴다.
      REAL_IP_HEADER: "X-Forwarded-For"
      REAL_IP_RECURSIVE: "on"
      SET_REAL_IP_FROM: "127.0.0.1,${PORTFOLIO_GATEWAY_IP:-10.203.48.1}"
      ZEEKAD_GATEWAY_IP: ${PORTFOLIO_GATEWAY_IP:-10.203.48.1}
      ZEEKAD_LOGIN_RATE: ${PORTFOLIO_LOGIN_RATE:-10r/m}
      ZEEKAD_LOGIN_BURST: ${PORTFOLIO_LOGIN_BURST:-5}
      # T33: 분석가 쓰기 네 경로(상태 변경·담당 지정·검토 결정 둘)의 POST만 클라이언트 IP당 제한한다(로그인 제한과 따로). 초과 시 429.
      ZEEKAD_WRITE_RATE: ${PORTFOLIO_WRITE_RATE:-10r/m}
      ZEEKAD_WRITE_BURST: ${PORTFOLIO_WRITE_BURST:-5}
      # T36: 공개 경로(DSM에서 온 요청)의 /api/ 조회(GET·HEAD)만 클라이언트 IP당 제한한다(허용 밖 조회 거부 감사가 쌓이는 속도를 묶음).
      # 스택 안 8443 리스너는 세지 않는다. 초과 시 429. 기본값 근거(빠른 사람 사용 측정)는 docs/portfolio-deployment.md.
      ZEEKAD_READ_RATE: ${PORTFOLIO_READ_RATE:-200r/m}
      ZEEKAD_READ_BURST: ${PORTFOLIO_READ_BURST:-30}
      MODSEC_RULE_ENGINE: "on"
      # compose.yml과 같다: CRS 기본 허용 메서드에 PUT만 더한다.
      ALLOWED_METHODS: "GET HEAD POST PUT OPTIONS"
      PARANOIA: "1"
      BLOCKING_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      MODSEC_AUDIT_ENGINE: "RelevantOnly"
      # 감사 로그에 남기는 부분(요청·응답의 헤더와 본문은 뺀다)은 WAF 이미지(docker/nginx-waf/Dockerfile)가 정한다. 여기서 덮지 않는다.
      MODSEC_AUDIT_LOG: "/dev/stdout"
    # T61: 모든 capability 제거(이미지가 nginx 계정으로 8080·8443을 연다. 1024 아래 포트를 쓰지 않는다).
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # T61: Host를 이름으로 보낸다. 숫자 주소 Host는 CRS 920350에 걸려 응답이 200이어도 상태 확인마다 감사 줄이 남았다(10초마다 한 줄).
      # 접속 주소는 127.0.0.1 그대로다(localhost 이름으로 접속하면 IPv6 해석에 걸릴 수 있다). WAF 규칙은 끄지 않는다.
      test: ["CMD", "wget", "-q", "--spider", "--header", "Host: localhost", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    mem_limit: 512m
    logging: *zeekad-logging
    restart: unless-stopped
    networks:
      portfolio-net:
        # T32: 고정 주소. 앱(DASHBOARD_TRUSTED_PROXIES)이 이 주소에서 온 연결의 전달 헤더만 믿는다.
        # 동적 배정(.2부터)과 겹치지 않게 서브넷 끝쪽을 쓴다. PORTFOLIO_SUBNET을 바꾸면 이 값도 그 안으로 바꾼다.
        ipv4_address: ${PORTFOLIO_WAF_IP:-10.203.48.250}

  # 계정 시드(한 번씩 실행하는 도구. up으로는 뜨지 않는다): 공개 계정(demo, trial-analyst)만 활성, 나머지 계정 비활성. 멱등.
  # T54: 분석이 끝난 예시 셋도 기록한다(시연 분석가 demo-analyst로 앱 API를 불러, 기록하는 동안만 그 계정을 켠다). sandbox-setup 앞에 돌린다.
  demo-seed:
    profiles: ["seed"]
    image: ${PORTFOLIO_PIPELINE_IMAGE:-zeekad-pipeline:dev}
    entrypoint: ["python", "/seed/seed_demo.py"]
    volumes:
      - ./docker/portfolio/seed:/seed:ro
    environment:
      SEED_API_BASE_URL: http://dashboard-app:8080
      SEED_DB_HOST: postgres
      SEED_DB_PORT: "5432"
      DASHBOARD_APP_PASSWORD: ${DASHBOARD_APP_PASSWORD:-}
      # T54: 분석이 끝난 예시(seed/demo_examples.json)의 상태를 판정할 때 zeekad 계약 뷰를 읽는 계정. 앱과 같은 읽기 전용 dashboard_ro(새 비밀값이 아니다).
      DASHBOARD_RO_PASSWORD: ${DASHBOARD_RO_PASSWORD:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DEMO_DISPLAY_NAME: ${DEMO_DISPLAY_NAME:-포트폴리오 방문자 (읽기 전용)}
      # T33 체험용 분석가 계정 trial-analyst. 비어 있으면 시드가 만들지 않고(이미 있으면 비활성) 알린다.
      TRIAL_ANALYST_PASSWORD: ${TRIAL_ANALYST_PASSWORD:-}
      TRIAL_ANALYST_DISPLAY_NAME: ${TRIAL_ANALYST_DISPLAY_NAME:-포트폴리오 방문자 (분석가 체험)}
      # 공개 계정(demo, trial-analyst) 허용 캡처(쉼표 구분). 비어 있으면 시드 스크립트 기본값 cic17-*,syn1-*,lab-20261119,lab-20261122.
      DEMO_CAPTURE_PATTERNS: ${DEMO_CAPTURE_PATTERNS:-}
      BOOTSTRAP_VIEWER1_PASSWORD: ${BOOTSTRAP_VIEWER1_PASSWORD:-}
      BOOTSTRAP_ANALYST1_PASSWORD: ${BOOTSTRAP_ANALYST1_PASSWORD:-}
      BOOTSTRAP_ANALYST2_PASSWORD: ${BOOTSTRAP_ANALYST2_PASSWORD:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_TOTP_SECRET: ${BOOTSTRAP_ADMIN_TOTP_SECRET:-}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      dashboard-app:
        condition: service_healthy
    mem_limit: 256m
    logging: *zeekad-logging
    networks:
      - portfolio-data

  # T33 체험 계정 초기화 설정(한 번씩 실행하는 도구, profile seed): 기준선·초기화 함수 셋·전용 역할 zeekad_sandbox_reset을 만든다. 멱등.
  # T58: 앱 migration V4가 만든 감사 로그 삭제 함수의 EXECUTE도 그 역할에 준다(표 권한은 주지 않는다. 앱이 V4를 적용한 뒤에 돌린다).
  # 새 스냅샷을 올린 뒤에는 sandbox-reset을 멈추고 --rebuild-baseline으로 기준선을 다시 만든다(docs/portfolio-deployment.md).
  sandbox-setup:
    profiles: ["seed"]
    image: ${PORTFOLIO_POSTGRES_IMAGE:-pgvector/pgvector:0.8.1-pg17}
    entrypoint: ["bash", "/sandbox/sandbox-setup.sh"]
    user: postgres
    volumes:
      - ./docker/portfolio/sandbox:/sandbox:ro
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-}
      SANDBOX_RESET_DB_PASSWORD: ${SANDBOX_RESET_DB_PASSWORD:-}
      # 기준선을 만들기 전에 흔적이 없어야 하는 체험 계정 이름(시드의 trial-analyst와 같다)
      SANDBOX_TRIAL_USERNAME: trial-analyst
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    # T36: 이미지가 VOLUME으로 선언한 데이터 경로를 작은 tmpfs로 덮어 익명 볼륨이 생기지 않게 한다(이 컨테이너는 psql만 쓴다).
    tmpfs: ["/tmp", "/var/lib/postgresql/data:size=1m"]
    depends_on:
      postgres:
        condition: service_healthy
      dashboard-app:
        condition: service_healthy
    mem_limit: 128m
    logging: *zeekad-logging
    networks:
      - portfolio-data

  # T33 체험 계정 초기화(상주): 매시 정각(UTC·KST 모두 정각)에 sandbox.reset_pipeline() 다음 sandbox.reset_assignments()를 부르고
  # 결과 행 수를 한 줄로 남긴다. 앱 밖 운영 작업이다(앱에는 데모 전용 동작이 없다).
  # T58: 하루에 한 번(UTC 날짜가 바뀐 뒤 첫 주기) 보관 기한이 지난 감사 로그를 앱 DB의 삭제 함수 public.purge_expired_audit_logs(<일>)로 지운다.
  # 접속 계정 zeekad_sandbox_reset은 초기화 함수 셋(T56: sandbox.reset_response_actions() 포함)과 그 삭제 함수의 EXECUTE만 있다(표 권한 없음).
  # 포트 없음, psql만 쓴다. sandbox-setup 전에는 "NOT_CONFIGURED"만 남긴다. 한 번만: docker compose ... exec sandbox-reset bash /sandbox/sandbox-reset.sh --once
  sandbox-reset:
    image: ${PORTFOLIO_POSTGRES_IMAGE:-pgvector/pgvector:0.8.1-pg17}
    entrypoint: ["bash", "/sandbox/sandbox-reset.sh"]
    user: postgres
    volumes:
      - ./docker/portfolio/sandbox:/sandbox:ro
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      SANDBOX_RESET_DB_PASSWORD: ${SANDBOX_RESET_DB_PASSWORD:-}
      # 주기(분). 60 = 매시 정각. 리허설은 1.
      SANDBOX_RESET_INTERVAL_MINUTES: ${SANDBOX_RESET_INTERVAL_MINUTES:-60}
      # T58 감사 로그 보관 기한(일). 공개 데모는 90일로 고정한다. 비우거나 0이면 지우지 않는다. 정수 30~3650만 받는다(DB 함수의 바닥값이 30일).
      SANDBOX_AUDIT_RETENTION_DAYS: "90"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    # T36: 이미지가 VOLUME으로 선언한 데이터 경로를 작은 tmpfs로 덮어 익명 볼륨이 생기지 않게 한다(이 컨테이너는 psql만 쓴다).
    tmpfs: ["/tmp", "/var/lib/postgresql/data:size=1m"]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 64m
    logging: *zeekad-logging
    restart: unless-stopped
    networks:
      - portfolio-data

volumes:
  pgdata:

networks:
  portfolio-net:
    driver: bridge
    ipam:
      config:
        # 고정 서브넷: nginx-waf 고정 주소(PORTFOLIO_WAF_IP)와 게이트웨이(PORTFOLIO_GATEWAY_IP)가 이 안에 있어야 한다.
        # NAS의 기존 Docker 네트워크와 겹치지 않게 배포 전에 확인한다(docs/portfolio-deployment.md).
        # 바꾸면 PORTFOLIO_SUBNET과 함께 PORTFOLIO_WAF_IP·PORTFOLIO_GATEWAY_IP도 그 서브넷 안으로 바꾼다.
        - subnet: ${PORTFOLIO_SUBNET:-10.203.48.0/24}
  # T61 데이터 네트워크(내부 전용): dashboard-app·postgres·api와 초기화·시드 도구만 붙는다. internal이라 호스트 밖으로 나가는 길이 없고
  # 포트를 열 수도 없다. 바깥 길은 portfolio-net에 붙는 nginx-waf와 dashboard-app에만 남는다(portfolio-net은 WAF 포트를 열어야 해서
  # 내부 전용으로 만들 수 없다).
  # 서브넷은 portfolio-net·NAS의 기존 Docker 네트워크와 겹치지 않게 한다(docs/portfolio-deployment.md).
  # 이미 만든 뒤에는 internal 줄이나 서브넷을 바꿔도 있는 네트워크를 그대로 쓴다(바꾸려면 붙은 서비스를 멈추고 네트워크를 지운 뒤 다시 올린다).
  portfolio-data:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${PORTFOLIO_DATA_SUBNET:-10.203.47.0/24}
