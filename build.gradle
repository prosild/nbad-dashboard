plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.cyclonedx.bom' version '1.10.0'
}

group = 'com.zeekad'
version = '0.1.0-SNAPSHOT'

ext {
    set('tomcat.version', '10.1.62')
    set('thymeleaf.version', '3.1.7.RELEASE')
    set('spring-security.version', '6.5.11')
    set('spring-framework.version', '6.2.19')
    set('jackson-bom.version', '2.22.4')
    set('postgresql.version', '42.7.14')
    set('logback.version', '1.5.38')
    set('log4j2.version', '2.26.1')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    runtimeOnly 'org.postgresql:postgresql'

    constraints {
        implementation('org.mybatis:mybatis:3.5.19') {
            because 'Use latest MyBatis 3.5.x release'
        }
        implementation('ognl:ognl:3.4.17') {
            because 'Fix CVE-2026-113730'
        }
    }

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('cyclonedxBom') {
    includeConfigs = ['runtimeClasspath']
    projectType = 'application'
    schemaVersion = '1.5'
    destination = layout.buildDirectory.dir('reports').get().asFile
    outputName = 'bom'
    outputFormat = 'all'
}
