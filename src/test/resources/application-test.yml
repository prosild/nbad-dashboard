spring:
  thymeleaf:
    cache: false

server:
  servlet:
    session:
      cookie:
        secure: ${DASHBOARD_COOKIE_SECURE:false}

dashboard:
  datasource:
    app:
      url: jdbc:h2:mem:zeekad_dashboard_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
      username: dashboard_app
      password: ""
      driver-class-name: org.h2.Driver
    zeekad-read:
      url: jdbc:h2:mem:zeekad_read_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
      username: dashboard_ro
      password: ""
      driver-class-name: org.h2.Driver
    zeekad-write:
      url: jdbc:h2:mem:zeekad_write_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
      username: dashboard_rw
      password: ""
      driver-class-name: org.h2.Driver
  security:
    bcrypt-strength: 4
