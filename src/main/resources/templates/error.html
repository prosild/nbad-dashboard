<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오류 안내 - zeek_AD Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
<div class="auth-container">
    <div class="card">
        <h1 th:text="${errorTitle != null ? errorTitle : '요청을 처리할 수 없습니다'}">요청을 처리할 수 없습니다</h1>
        <p class="muted">상태 코드: <strong th:text="${statusCode != null ? statusCode : 500}">500</strong></p>
        <p th:text="${errorMessage != null ? errorMessage : '오류가 발생했습니다. 잠시 후 다시 시도하세요.'}">오류가 발생했습니다.</p>
        <a th:href="@{/}" class="btn btn-primary">홈으로 돌아가기</a>
    </div>
</div>
</body>
</html>
