<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="topbar(activeMenu)" class="topbar">
    <a th:href="@{/}" class="topbar-brand">zeek_AD Dashboard</a>
    <nav class="topbar-nav">
        <a th:href="@{/incidents}" th:classappend="${activeMenu == 'incidents'} ? ' nav-active' : ''">조사 큐</a>
        <a th:href="@{/operations}" th:classappend="${activeMenu == 'operations'} ? ' nav-active' : ''">운영 상태</a>
        <a th:href="@{/reviews}" th:classappend="${activeMenu == 'reviews'} ? ' nav-active' : ''">승인 대기</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}"
           th:classappend="${activeMenu == 'admin-users'} ? ' nav-active' : ''">사용자 관리</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/audit-logs}"
           th:classappend="${activeMenu == 'admin-audit'} ? ' nav-active' : ''">감사 로그</a>
    </nav>
    <div class="topbar-user">
        <span th:if="${currentUser != null}">
            <strong th:text="${currentUser.displayName}"></strong>
            (<span th:text="${currentUser.role.koreanLabel}"></span>)
        </span>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-secondary btn-sm">로그아웃</button>
        </form>
    </div>
</header>
</body>
</html>
