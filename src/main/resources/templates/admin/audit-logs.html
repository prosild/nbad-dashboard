<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>감사 로그 - zeek_AD Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
<header class="topbar">
    <a th:href="@{/}" class="topbar-brand">zeek_AD Dashboard</a>
    <nav class="topbar-nav">
        <a th:href="@{/}">조사 큐</a>
        <a th:href="@{/admin/users}">사용자 관리</a>
        <a th:href="@{/admin/audit-logs}">감사 로그</a>
    </nav>
    <div class="topbar-user">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-secondary btn-sm">로그아웃</button>
        </form>
    </div>
</header>

<main class="container">
    <div class="card">
        <h2>감사 로그 조회 (불변 기록)</h2>
        <form th:action="@{/admin/audit-logs}" method="get" class="form-inline">
            <div class="form-group">
                <label for="filter-action">액션 유형</label>
                <select id="filter-action" name="actionType" class="form-control">
                    <option value="">전체</option>
                    <option th:each="t : ${actionTypes}"
                            th:value="${t.name()}"
                            th:selected="${t.name() == selectedActionType}"
                            th:text="${t.name()}"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="filter-actor">사용자 아이디</label>
                <input id="filter-actor" name="actorUsername" type="text" class="form-control"
                       th:value="${selectedActorUsername}" placeholder="부분 일치 검색">
            </div>
            <div class="form-group">
                <label for="filter-limit">조회 건수</label>
                <input id="filter-limit" name="limit" type="number" min="1" max="500"
                       class="form-control" th:value="${selectedLimit}">
            </div>
            <button type="submit" class="btn btn-primary">조회</button>
        </form>
    </div>

    <div class="card">
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>발생 시각 (UTC)</th>
                    <th>행위자</th>
                    <th>역할</th>
                    <th>액션</th>
                    <th>대상 캡처</th>
                    <th>대상 작업/사건</th>
                    <th>세부 내용</th>
                    <th>클라이언트 IP</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${logs}">
                    <td th:text="${item.id}"></td>
                    <td th:text="${item.occurredAt}"></td>
                    <td th:text="${item.actorUsername}"></td>
                    <td th:text="${item.actorRole}"></td>
                    <td><span class="badge" th:text="${item.actionType}"></span></td>
                    <td th:text="${item.targetCaptureId}"></td>
                    <td>
                        <span th:if="${item.targetJobId != null}" th:text="'job=' + ${item.targetJobId} + ' '"></span>
                        <span th:text="${item.targetIncidentId}"></span>
                    </td>
                    <td class="code-block" th:text="${item.detailJson}"></td>
                    <td th:text="${item.clientIp}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(logs)}">
                    <td colspan="9" class="muted">조건에 맞는 감사 로그가 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
