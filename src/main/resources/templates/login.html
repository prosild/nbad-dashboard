<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - zeek_AD Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
<div class="auth-container">
    <div class="card">
        <h1>zeek_AD 이상탐지 대시보드</h1>
        <p class="muted">허가된 사용자 계정으로 로그인하세요.</p>

        <div th:if="${param.error}" class="alert alert-danger">
            아이디 또는 비밀번호가 올바르지 않습니다.
        </div>
        <div th:if="${param.locked}" class="alert alert-danger">
            로그인 연속 실패로 계정이 일시 잠겼습니다. 15분 후 다시 시도하거나 관리자에게 잠금 해제를 요청하세요.
        </div>
        <div th:if="${param.disabled}" class="alert alert-danger">
            비활성화된 계정입니다. 관리자에게 문의하세요.
        </div>
        <div th:if="${param.expired}" class="alert alert-warn">
            세션이 만료되었습니다. 다시 로그인해 주세요.
        </div>
        <div th:if="${param.logout}" class="alert alert-success">
            로그아웃되었습니다.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">아이디</label>
                <input id="username" name="username" type="text" class="form-control" required autofocus autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input id="password" name="password" type="password" class="form-control" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary">로그인</button>
        </form>
    </div>
</div>
</body>
</html>
