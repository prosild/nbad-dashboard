<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>분석가 승인 대기 목록 - zeek_AD Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: topbar('reviews')}"></header>

<main class="container">
    <div th:if="${maskedView}" class="alert alert-warn">
        조회자(VIEWER) 권한으로 접속 중입니다. 자산 IP 주소는 마스킹되어 표시됩니다.
    </div>

    <div th:if="${reviewSuccess}" class="alert alert-success" th:text="${reviewSuccess}"></div>
    <div th:if="${reviewError}" class="alert alert-danger" th:text="${reviewError}"></div>

    <div class="card">
        <h1>분석가 승인 대기 목록</h1>
        <form th:action="@{/reviews}" method="get" class="form-inline">
            <div class="form-group">
                <label for="rev-capture">캡처 필터</label>
                <select id="rev-capture" name="captureId" class="form-control">
                    <option value="">허용된 전체 캡처</option>
                    <option th:each="cap : ${allowedCaptures}"
                            th:value="${cap}"
                            th:selected="${cap == selectedCaptureId}"
                            th:text="${cap}"></option>
                </select>
            </div>
            <div class="form-group checkbox-inline">
                <label for="rev-pending-only">
                    <input id="rev-pending-only" type="checkbox" name="pendingOnly" value="true"
                           th:checked="${pendingOnly}">
                    미처리 대기 건만 보기
                </label>
            </div>
            <button type="submit" class="btn btn-primary">조회</button>
        </form>
    </div>

    <div class="card">
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>작업 / 순위</th>
                    <th>캡처</th>
                    <th>자산 IP</th>
                    <th>역할</th>
                    <th>검토 사유</th>
                    <th>요청 시각 (UTC)</th>
                    <th>결정 · 반영 상태</th>
                    <th>분석가 / 결정 시각</th>
                    <th>검토 결정</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="rev : ${reviews}">
                    <td>
                        <a th:href="@{/incidents/{jobId}/rank/{rank}(jobId=${rev.jobId}, rank=${rev.queueRank})}"
                           th:text="'job #' + ${rev.jobId} + ' / #' + ${rev.queueRank}"></a>
                        <div class="muted" th:if="${rev.reviewJobId != null}"
                             th:text="'검토 job #' + ${rev.reviewJobId}"></div>
                    </td>
                    <td th:text="${rev.captureId}"></td>
                    <td class="code-inline" th:text="${rev.hostIp}"></td>
                    <td><span class="badge" th:text="${rev.zeekadRole}"></span></td>
                    <td th:text="${rev.zeekadReviewReason}"></td>
                    <td class="muted" th:text="${rev.requestedAt}"></td>
                    <td>
                        <div th:if="${rev.pending}">
                            <span class="badge badge-warn">대기 중</span>
                        </div>
                        <div th:unless="${rev.pending}" class="badge-group">
                            <span class="badge badge-info" th:text="${rev.zeekadReviewAction}"></span>
                            <span class="badge"
                                  th:classappend="${rev.resumeFailed} ? ' badge-danger' : (${rev.zeekadReviewResumedAt != null} ? ' badge-success' : ' badge-warn')"
                                  th:text="${rev.resumeStatusLabel}"></span>
                        </div>
                        <div th:if="${!rev.pending and rev.zeekadReviewResumedAt != null}" class="muted"
                             th:text="${rev.zeekadReviewResumedAt}"></div>
                    </td>
                    <td>
                        <div th:text="${rev.analystDisplay != null ? rev.analystDisplay : '-'}"></div>
                        <div class="muted" th:text="${rev.decidedAt != null ? rev.decidedAt : ''}"></div>
                    </td>
                    <td>
                        <form th:if="${rev.pending and canDecideReview}"
                              th:action="@{/reviews/decide}"
                              method="post"
                              class="review-decision-form">
                            <input type="hidden" name="jobId" th:value="${rev.reviewJobId}">
                            <input type="hidden" name="incidentId" th:value="${rev.incidentId}">
                            <input type="hidden" name="captureId" th:value="${selectedCaptureId}">
                            <input type="hidden" name="pendingOnly" th:value="${pendingOnly}">
                            <input type="text" name="note" class="form-control" placeholder="결정 메모 (선택)">
                            <div class="actions-stack">
                                <button type="submit" name="action" value="confirm" class="btn btn-primary btn-sm">
                                    조사 진행 (confirm)
                                </button>
                                <button type="submit" name="action" value="dismiss" class="btn btn-secondary btn-sm">
                                    오탐 종료 (dismiss)
                                </button>
                            </div>
                        </form>
                        <span th:if="${rev.pending and !canDecideReview}" class="muted">분석가 이상 결정 가능</span>
                        <span th:unless="${rev.pending}" class="muted">결정 완료</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(reviews)}">
                    <td colspan="9" class="muted">조건에 맞는 승인 대기 항목이 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
