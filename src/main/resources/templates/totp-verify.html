<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 2단계 인증 - zeek_AD Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
<div class="auth-container">
    <div class="card">
        <h1>관리자 2단계 인증 (TOTP)</h1>
        <p class="muted">인증 앱에 표시된 6자리 일회용 코드를 입력하세요.</p>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <form th:action="@{/login/totp}" method="post">
            <div class="form-group">
                <label for="code">6자리 인증 코드</label>
                <input id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]{6}"
                       maxlength="6" class="form-control" required autofocus autocomplete="one-time-code">
            </div>
            <button type="submit" class="btn btn-primary">인증 확인</button>
        </form>

        <hr>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-secondary btn-sm">로그아웃</button>
        </form>
    </div>
</div>
</body>
</html>
