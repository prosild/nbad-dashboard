<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 TOTP 최초 등록 - zeek_AD Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
<div class="auth-container">
    <div class="card">
        <h1>관리자 2단계 인증 (TOTP) 등록</h1>
        <p class="muted">인증 앱(Google Authenticator, FreeOTP 등)에 아래 시크릿 키 또는 URI를 등록한 뒤, 생성된 6자리 코드를 입력해 활성화를 완료하세요.</p>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <div class="form-group">
            <label>Base32 시크릿 키</label>
            <div class="code-block" th:text="${totpSecret}"></div>
        </div>
        <div class="form-group">
            <label>otpauth URI</label>
            <div class="code-block" th:text="${otpauthUri}"></div>
        </div>

        <form th:action="@{/login/totp/setup}" method="post">
            <div class="form-group">
                <label for="code">확인용 6자리 인증 코드</label>
                <input id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]{6}"
                       maxlength="6" class="form-control" required autofocus autocomplete="one-time-code">
            </div>
            <button type="submit" class="btn btn-primary">등록 완료 및 검증</button>
        </form>

        <hr>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-secondary btn-sm">로그아웃</button>
        </form>
    </div>
</div>
</body>
</html>
