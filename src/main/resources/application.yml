spring:
  application:
    name: zeek_ad_dashboard
  flyway:
    enabled: false
  web:
    resources:
      add-mappings: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: ${DASHBOARD_SESSION_IDLE_TIMEOUT:30m}
      cookie:
        name: ZEEKAD_SESSION
        http-only: true
        same-site: lax
        secure: ${DASHBOARD_COOKIE_SECURE:true}
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never

dashboard:
  # 로그인 화면 안내 문구(일반 텍스트, 최대 300자. 넘으면 시작 때 실패). 기본 빈 값이면 화면에 아무것도 보이지 않는다.
  login-notice: ${DASHBOARD_LOGIN_NOTICE:}
  # 기준 시각(T23). 인시던트 큐의 상대 기간(최근 24시간 등)을 이 시각에서 거꾸로 센다.
  #   now(기본): 서버 현재 시각. 데이터가 계속 들어오는 운영 배포.
  #   latest-data: 그 사용자가 볼 수 있는 캡처의 성공 작업 완료 시각 최대값. 데이터가 더 늘지 않는 고정 스냅샷 배포
  #                (과거 데이터 조사용 일반 설정). 화면 맨 위에 "고정 스냅샷 · 기준 시각"을 늘 보이고 자동 갱신을 끈다.
  #   다른 값이면 앱 시작 때 실패한다.
  time-anchor: ${DASHBOARD_TIME_ANCHOR:now}
  capture-sources:
    # 실습망 센서(live)로 볼 캡처 패턴(쉼표 목록, 접두어* 문법). 나머지는 가져온 데이터(imported)다. 잘못된 패턴이면 시작 때 실패한다.
    live-patterns: ${DASHBOARD_LIVE_CAPTURE_PATTERNS:lab-*}
    # 센서 상태(T24, 현황판·운영 현황 수집원 상태). 기준 시각 − 센서의 마지막 채점(성공 작업 완료 시각)이
    #   stale-after 이하면 정상, down-after 이하면 지연, 넘으면 중단이다. 가장 최근 끝난 작업이 실패면 실패다.
    #   기본 15분(5분 파일 채점 세 번을 놓침)·1시간. 형식은 Spring Duration(PT15M, 15m 등).
    #   형식이 틀리거나 0 이하이거나 stale-after ≥ down-after면 앱 시작 때 실패한다.
    stale-after: ${DASHBOARD_SENSOR_STALE_AFTER:15m}
    down-after: ${DASHBOARD_SENSOR_DOWN_AFTER:1h}
  sla:
    ack:
      # 착수 목표(T25). 실습망(live) 수집원의 신규 인시던트가 탐지 뒤 지금 우선순위의 목표 시간을 넘기면 "착수 지연"이다.
      #   가져온 데이터는 재생 데이터라 따지지 않는다. 형식은 Spring Duration(30m, 4h 등).
      #   0 이하이거나 high ≤ medium ≤ low가 아니면 앱 시작 때 실패한다.
      high: ${DASHBOARD_SLA_ACK_HIGH:30m}
      medium: ${DASHBOARD_SLA_ACK_MEDIUM:4h}
      low: ${DASHBOARD_SLA_ACK_LOW:24h}
  datasource:
    app:
      url: jdbc:postgresql://${DASHBOARD_DB_HOST:127.0.0.1}:${DASHBOARD_DB_PORT:55432}/${DASHBOARD_DB_NAME:zeekad_dashboard}
      username: ${DASHBOARD_DB_USER:dashboard_app}
      password: ${DASHBOARD_APP_PASSWORD:${DASHBOARD_DB_PASSWORD:}}
      driver-class-name: org.postgresql.Driver
    zeekad-read:
      url: jdbc:postgresql://${ZEEKAD_DB_HOST:127.0.0.1}:${ZEEKAD_DB_PORT:55432}/${ZEEKAD_DB_NAME:zeekad}
      username: ${ZEEKAD_RO_USER:dashboard_ro}
      password: ${ZEEKAD_RO_PASSWORD:}
      driver-class-name: org.postgresql.Driver
    zeekad-write:
      url: jdbc:postgresql://${ZEEKAD_DB_HOST:127.0.0.1}:${ZEEKAD_DB_PORT:55432}/${ZEEKAD_DB_NAME:zeekad}
      username: ${ZEEKAD_RW_USER:dashboard_rw}
      password: ${ZEEKAD_RW_PASSWORD:}
      driver-class-name: org.postgresql.Driver
  evidence-api:
    url: ${ZEEKAD_EVIDENCE_API_URL:http://127.0.0.1:8000}
  security:
    bcrypt-strength: 12
    max-failed-attempts: ${DASHBOARD_MAX_FAILED_ATTEMPTS:5}
    lockout-minutes: ${DASHBOARD_LOCKOUT_MINUTES:15}
    # T29: 잠금 제외 공유 조회 계정(쉼표 목록, 기본 비어 있음). 비밀번호를 공개한 VIEWER 계정만 넣는다.
    lockout-exempt-usernames: ${DASHBOARD_LOCKOUT_EXEMPT_USERNAMES:}
    idle-timeout-minutes: ${DASHBOARD_IDLE_TIMEOUT_MINUTES:30}
    absolute-timeout-minutes: ${DASHBOARD_ABSOLUTE_TIMEOUT_MINUTES:480}
    totp-issuer: "zeek_AD Dashboard"
  bootstrap:
    common-password: ${DASHBOARD_BOOTSTRAP_PASSWORD:}
    viewer1-password: ${BOOTSTRAP_VIEWER1_PASSWORD:}
    analyst1-password: ${BOOTSTRAP_ANALYST1_PASSWORD:}
    analyst2-password: ${BOOTSTRAP_ANALYST2_PASSWORD:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    admin-totp-secret: ${BOOTSTRAP_ADMIN_TOTP_SECRET:}
